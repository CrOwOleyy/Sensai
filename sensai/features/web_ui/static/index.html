<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensai — Poudlard Edition</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --border: #e2e5ee; --text: #1c2030; --muted: #6b7185;
    --accent: #741b1b; --accent-text: #ffffff; --user: #741b1b; --user-text: #fff;
    --bot: #eceff7; --code: #e4e8f3; --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11131a; --panel: #181b25; --border: #2a2f3e; --text: #e8eaf2; --muted: #8b92a8;
      --accent: #b83a3a; --accent-text: #ffffff; --user: #8a2424; --user-text: #fff;
      --bot: #222636; --code: #2b3042; --danger: #ef6a6a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; display: flex; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  aside { width: 260px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; }
  aside h1 { margin: 0; padding: 14px 16px 4px; font-size: 20px; letter-spacing: .5px; }
  aside h1 span { color: #d4a017; }
  aside .tagline { padding: 0 16px 12px; font-size: 11px; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; font-weight: 600; }
  #new-chat { margin: 0 12px 12px; padding: 9px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); font-weight: 600; }
  #sessions { flex: 1; overflow-y: auto; padding: 0 8px; }
  .session { display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 8px 10px; border-radius: 8px; color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .session:hover { background: var(--bot); }
  .session.active { background: var(--bot); font-weight: 600; }
  .session small { display: block; color: var(--muted); font-weight: 400; }
  #open-profile { margin: 12px; padding: 8px; border: 1px solid var(--border);
    border-radius: 8px; background: none; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; flex-wrap: wrap;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  header label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
  .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .header-actions button { padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border);
    background: none; font-size: 12px; color: var(--text); }
  .header-actions button:hover { background: var(--bot); }
  #usage { color: var(--muted); font-size: 12px; }

  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(720px, 85%); padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
    word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .msg.assistant { align-self: flex-start; background: var(--bot); }
  .msg.error { align-self: center; background: none; color: var(--danger); border: 1px solid var(--danger); }
  .msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
  .msg code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, monospace; }
  .msg pre code { padding: 0; background: none; }
  #empty { margin: auto; color: var(--muted); text-align: center; }

  form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); max-height: 160px; }
  #send { padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  #send:disabled { opacity: .5; cursor: default; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text);
    width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row input { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .dialog-actions button, .row button { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: none; }
  .dialog-actions .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  @media (max-width: 700px) {
    aside { display: none; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<aside>
  <h1>SENSAI <span>⚡</span></h1>
  <div class="tagline">Académie de Poudlard</div>
  <button id="new-chat">+ Nouvelle consultation</button>
  <div id="sessions"></div>
  <button id="open-profile">Profil élève</button>
</aside>

<main>
  <header>
    <label>Professeur <select id="persona"></select></label>
    <label>Modèle <select id="model"></select></label>
    <div class="header-actions">
      <button id="export-md" type="button" title="Exporter en Markdown">Export MD</button>
      <button id="export-json" type="button" title="Exporter en JSON">Export JSON</button>
      <span id="usage" title="Tokens du dernier échange">Tokens : —</span>
    </div>
  </header>
  <div id="messages"><div id="empty">Pose une question magique ou demande un cours à un professeur pour commencer.</div></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Écris un message… (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)"></textarea>
    <button id="send" type="submit">Envoyer</button>
  </form>
</main>

<dialog id="profile-dialog">
  <h3 style="margin-top:0">Profil élève (Poudlard)</h3>
  <p style="color:var(--muted);margin-top:0">Ces informations (ex: maison, année, matières) sont injectées dans le prompt système à chaque échange.</p>
  <div id="profile-rows"></div>
  <button type="button" id="add-row" style="padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:none">+ Ajouter</button>
  <div class="dialog-actions">
    <button type="button" id="profile-cancel">Annuler</button>
    <button type="button" id="profile-save" class="primary">Enregistrer</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;
let busy = false;

function esc(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
// Minimal markdown: fenced code, inline code, bold. Input is escaped first.
function render(text) {
  return esc(text)
    .replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, c) => `<pre><code>${c.replace(/\n$/, "")}</code></pre>`)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

function addMessage(role, text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "assistant") el.innerHTML = render(text); else el.textContent = text;
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function fillSelect(select, values, current) {
  select.innerHTML = "";
  for (const v of values) {
    const opt = new Option(v, v);
    select.add(opt);
  }
  if (current && !values.includes(current)) select.add(new Option(current, current));
  if (current) select.value = current;
}

async function loadState() {
  const st = await api("/api/state");
  fillSelect($("persona"), st.personas, st.persona || (st.personas.includes("dumbledore") ? "dumbledore" : st.personas[0]));
  fillSelect($("model"), st.models, st.model);
  renderSessions(st.sessions);
  return st;
}

function renderSessions(sessions) {
  const box = $("sessions");
  box.innerHTML = "";
  for (const s of sessions) {
    const b = document.createElement("button");
    b.className = "session" + (s.id === sessionId ? " active" : "");
    b.textContent = s.title || "Nouvelle consultation";
    const small = document.createElement("small");
    small.textContent = new Date(s.created_at).toLocaleString();
    b.appendChild(small);
    b.onclick = () => openSession(s.id);
    box.appendChild(b);
  }
}

async function refreshSessions() {
  renderSessions((await api("/api/state")).sessions);
}

async function openSession(id) {
  sessionId = id;
  const { messages } = await api(`/api/sessions/${id}`);
  $("messages").innerHTML = "";
  if (!messages.length) $("messages").innerHTML = '<div id="empty">Pose une question magique ou demande un cours à un professeur pour commencer.</div>';
  for (const m of messages) addMessage(m.role, m.content);
  $("usage").textContent = "Tokens : —";
  refreshSessions();
}

async function newSession() {
  const { id } = await api("/api/sessions", { method: "POST" });
  await openSession(id);
}

$("export-md").onclick = () => {
  if (sessionId) window.open(`/api/sessions/${sessionId}/export?format=markdown`, "_blank");
};

$("export-json").onclick = () => {
  if (sessionId) window.open(`/api/sessions/${sessionId}/export?format=json`, "_blank");
};

async function send(text) {
  busy = true;
  $("send").disabled = true;
  addMessage("user", text);
  const bubble = addMessage("assistant", "…");
  let reply = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId, message: text,
        persona: $("persona").value, model: $("model").value,
      }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const line = buf.slice(0, idx).replace(/^data: /, "");
        buf = buf.slice(idx + 2);
        const ev = JSON.parse(line);
        if (ev.type === "token") {
          reply += ev.content;
          bubble.innerHTML = render(reply);
        } else if (ev.type === "usage") {
          const total = (ev.prompt_tokens || 0) + (ev.completion_tokens || 0);
          $("usage").textContent = `Tokens : ${ev.prompt_tokens} prompt + ${ev.completion_tokens} réponse = ${total}`;
        } else if (ev.type === "error") {
          throw new Error(ev.message);
        }
        $("messages").scrollTop = $("messages").scrollHeight;
      }
    }
    refreshSessions();
  } catch (err) {
    bubble.className = "msg error";
    bubble.textContent = `Erreur : ${err.message}`;
  } finally {
    busy = false;
    $("send").disabled = false;
    $("input").focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = "";
  $("input").style.height = "auto";
  send(text);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = e.target.scrollHeight + "px";
});
$("new-chat").onclick = newSession;

// Profile dialog
function profileRow(key = "", value = "") {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<input placeholder="clé (ex: maison, annee, nom)"><input placeholder="valeur (ex: Gryffondor, 3e annee)">';
  row.children[0].value = key;
  row.children[1].value = value;
  $("profile-rows").appendChild(row);
}
$("open-profile").onclick = async () => {
  const { profile } = await api("/api/state");
  $("profile-rows").innerHTML = "";
  Object.entries(profile).forEach(([k, v]) => profileRow(k, v));
  if (!Object.keys(profile).length) profileRow();
  $("profile-dialog").showModal();
};
$("add-row").onclick = () => profileRow();
$("profile-cancel").onclick = () => $("profile-dialog").close();
$("profile-save").onclick = async () => {
  const values = {};
  for (const row of $("profile-rows").children) {
    const [k, v] = [row.children[0].value.trim(), row.children[1].value.trim()];
    if (k) values[k] = v;
  }
  await api("/api/profile", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ values }),
  });
  $("profile-dialog").close();
};

(async () => {
  const st = await loadState();
  if (st.sessions.length) await openSession(st.sessions[0].id); else await newSession();
})().catch((e) => addMessage("error", `Erreur : ${e.message}`));
</script>
</body>
</html>
